# Example for the http {} context. Replace domain/certificate paths before use.
# Dockerized Nginx on the existing default_default network uses anyone-im:4100.
map $http_upgrade $anyone_connection_upgrade {
    default upgrade;
    '' close;
}
upstream anyone_im {
    server 127.0.0.1:4100;
    keepalive 16;
}
server {
    listen 80;
    server_name im.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name im.example.com;
    ssl_certificate /etc/letsencrypt/live/im.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/im.example.com/privkey.pem;
    client_max_body_size 11m;

    location / {
        proxy_pass http://anyone_im;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anyone_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
