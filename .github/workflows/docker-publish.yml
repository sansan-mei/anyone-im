name: Manual Docker build and publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event_name }}-${{ github.ref }}
  # Do not interrupt a default-branch publication between its two tags.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  docker:
    if: github.repository == 'sansan-mei/anyone-im' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: 1596944197/anyone-im
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require publication credentials
        id: publish
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        shell: bash
        run: |
          set -euo pipefail
          echo 'enabled=false' >> "$GITHUB_OUTPUT"
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::DOCKERHUB_TOKEN is required for manual image publication.'
            exit 1
          fi
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: 1596944197/anyone-im
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and load the image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anyone-im:ci
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=anyone-im-amd64
          cache-to: type=gha,mode=max,scope=anyone-im-amd64

      - name: Check packaged PWA resources without network access
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint sh anyone-im:ci -ec '
            test -s /app/apps/web/dist/manifest.webmanifest
            test -s /app/apps/web/dist/sw.js
            test -s /app/apps/web/dist/offline.html
            test -s /app/apps/web/dist/icons/icon-192.png
            test -s /app/apps/web/dist/icons/icon-512.png
          '

      - name: Smoke-test the newly built image before publication
        run: bash scripts/ci-container-smoke.sh anyone-im:ci

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: '1596944197'
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      # Push the exact local image that passed the smoke test; do not rebuild it.
      - name: Publish the tested image
        if: steps.publish.outputs.enabled == 'true'
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag anyone-im:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Record verification scope
        if: success()
        env:
          PUBLISHED: ${{ steps.publish.outputs.enabled }}
        shell: bash
        run: |
          {
            echo '### Docker verification'
            echo "- Source commit: $GITHUB_SHA"
            echo '- Built linux/amd64 and passed the new-image MySQL container smoke test.'
            if [[ "$PUBLISHED" == 'true' ]]; then
              echo "- Published $IMAGE:latest and $IMAGE:sha-$GITHUB_SHA."
            else
              echo '- Build-only validation: Docker Hub login/push skipped; no publication verified.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
