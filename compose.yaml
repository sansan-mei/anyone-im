# Share the existing production Compose project/default network and MySQL.
name: default
services:
  anyone-im:
    image: 1596944197/anyone-im:latest
    container_name: anyone-im
    restart: unless-stopped
    init: true
    mem_limit: 384m
    env_file: .env
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - anyone-im-data:/data
volumes:
  anyone-im-data:
