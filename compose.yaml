# Existing production project/default network; no extra network or storage mounts.
name: default
services:
  anyone-im:
    image: 1596944197/anyone-im:latest
    container_name: anyone-im
    restart: unless-stopped
    init: true
    mem_limit: 384m
    ports:
      - "127.0.0.1:4100:4100"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4100"
      DB_PROVIDER: mysql
      PUBLIC_ORIGIN: https://im.mh33.top
      # Use the privately supplied ready-to-copy production block for the real password.
      DATABASE_URL: mysql://anyone_im:SET_DATABASE_PASSWORD@mysql:3306/anyone_im
